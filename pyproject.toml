[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata"
version = "0.1.0"
description = "Air-gapped personal knowledge engine and local hybrid RAG"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Alessandro" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Core CLI & Formatting
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Canonical Storage
    "sqlmodel>=0.0.18",
    "sqlalchemy>=2.0.0",

    # Derived Vector Index
    "qdrant-client>=1.9.0",

    # Sparse & Hybrid Retrieval
    "rank-bm25>=0.2.2",

    # Local Embeddings & Re-ranking (fast, local ONNX/PyTorch runtimes)
    "fastembed>=0.3.0",
    "sentence-transformers>=3.0.0",

    # Local LLM Client
    "ollama>=0.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
eval = ["ragas>=0.1.9", "langchain-community>=0.2.0", "datasets>=2.19.0"]

[project.scripts]
strata = "strata.cli.main:app"

# Hatch package discovery for src-layout
[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = ["E501"] # Handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy strict configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "fastembed.*",
    "sentence_transformers.*",
    "ragas.*",
    "datasets.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
