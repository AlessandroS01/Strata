name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.14"

      # Runs immediately in ~2s (no heavy dependency install needed)
      - name: Check code formatting (Ruff)
        run: uvx ruff format --check src/ tests/

      - name: Lint code (Ruff)
        run: uvx ruff check src/ tests/

      # Installs project dependencies (will use cache on subsequent runs)
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Strict static type checking (Mypy)
        run: uv run mypy --strict src/ tests/

  test:
    name: Test Suite (Python 3.14 on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit & integration tests with coverage
        run: uv run pytest -v --cov=strata tests/